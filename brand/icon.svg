<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- TeachMate home-tile icon: an orange graduation cap above a white open
       book, on a deep blue diagonal gradient. Glyph paths are Lucide
       (graduation-cap, book-open; ISC licence), 2px round strokes on the
       24-unit grid, scaled x12 into the middle 288 px. Render to
       brand/icon.png with any SVG rasteriser, e.g.
         rsvg-convert -w 512 -h 512 brand/icon.svg -o brand/icon.png
       (this PNG was rendered from this file with a headless browser). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E40AF"/><stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.25" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#gloss)"/>
  <g filter="url(#shadow)">
    <g transform="translate(112 112) scale(12)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- graduation cap, orange, small and high -->
      <g transform="translate(4.56 -0.96) scale(0.62)" stroke="#FFA552" stroke-width="2">
        <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/>
        <path d="M22 10v6"/>
      </g>
      <!-- open book, white, the main shape -->
      <g transform="translate(3 6.05) scale(0.75)" stroke="#fff" stroke-width="2">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </g>
    </g>
  </g>
</svg>
