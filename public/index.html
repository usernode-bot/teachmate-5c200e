<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return val.name || 'anonymous';
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>TeachMate</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <!-- Tailwind, PRECOMPILED for this app. npm run build compiles
       tailwind.config.js + styles/tailwind-input.css to public/tailwind.css on
       every image build. Class names must be written as whole literals — a
       class assembled from fragments at runtime is invisible to the compiler. -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path.
       Also how the app answers the shell (offline launch included) and learns
       the viewer's light/dark theme. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- The native-feel UI kit: swipe rows, menus, alerts, toasts, transitions. -->
  <link rel="stylesheet" href="/usernode-native/v1/native.css">
  <script src="/usernode-native/v1/native.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg" style="background:rgb(var(--ground))">
  <header id="chrome" data-noprint>
    <div class="flex items-center gap-2 px-4 pb-1 pt-3.5">
      <img src="/logo.svg" alt="" class="h-7 w-7">
      <h1 class="font-display text-heading font-bold leading-7">TeachMate</h1>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab is-on" id="tab-lessons" role="tab" aria-selected="true" data-nav="#/lessons">Lessons</button>
      <button class="tab" id="tab-quizzes" role="tab" aria-selected="false" data-nav="#/quizzes">Quizzes</button>
      <button class="tab" id="tab-grade" role="tab" aria-selected="false" data-nav="#/grade">Grade</button>
      <button class="tab" id="tab-scores" role="tab" aria-selected="false" data-nav="#/scores">Scores</button>
    </nav>
    <p id="demo-line" class="mx-4 mt-3 text-small text-muted" hidden><b class="font-semibold text-fg">Staging demo:</b> sample lessons, quizzes and class scores to try.</p>
  </header>
  <main id="view"></main>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
